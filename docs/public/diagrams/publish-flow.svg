<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">
  <rect x="0" y="0" width="960" height="400" rx="14" fill="#fbfaf7"/>
  <rect x="0.5" y="0.5" width="959" height="399" rx="13.5" fill="none" stroke="#e6e1d7"/>

  <text x="36" y="50" font-size="15" fill="#8a8578" letter-spacing="1">一次发布，两条走法</text>

  <!-- 主线 -->
  <g stroke-width="1.5">
    <rect x="28" y="110" width="130" height="84" rx="10" fill="#e8f1fb" stroke="#b9d3ee"/>
    <rect x="180" y="110" width="130" height="84" rx="10" fill="#f3f2ee" stroke="#ddd8cc"/>
    <rect x="332" y="110" width="130" height="84" rx="10" fill="#f3f2ee" stroke="#ddd8cc"/>
    <rect x="484" y="110" width="130" height="84" rx="10" fill="#f3f2ee" stroke="#ddd8cc"/>
    <rect x="636" y="110" width="130" height="84" rx="10" fill="#fdf3e0" stroke="#eed9ac"/>
    <rect x="788" y="110" width="130" height="84" rx="10" fill="#e9f4ec" stroke="#c3dfcb"/>
  </g>

  <g text-anchor="middle" font-size="15">
    <text x="93" y="146" fill="#2f5d8c">本地编辑器</text>
    <text x="93" y="170" fill="#5c86ad" font-size="12.5">改文章、存文件</text>

    <text x="245" y="146" fill="#4a4f57">提交</text>
    <text x="245" y="170" fill="#8a8f96" font-size="12.5">git commit</text>

    <text x="397" y="146" fill="#4a4f57">推送</text>
    <text x="397" y="170" fill="#8a8f96" font-size="12.5">git push</text>

    <text x="549" y="146" fill="#4a4f57">GitHub 仓库</text>
    <text x="549" y="170" fill="#8a8f96" font-size="12.5">代码放这儿</text>

    <text x="701" y="146" fill="#8a6220">自动构建</text>
    <text x="701" y="170" fill="#a8802f" font-size="12.5">GitHub Actions</text>

    <text x="853" y="146" fill="#2f6b41">线上页面</text>
    <text x="853" y="170" fill="#4e8a60" font-size="12.5">GitHub Pages</text>
  </g>

  <!-- 箭头 -->
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a8a294"/>
    </marker>
    <marker id="ah2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c0b9a9"/>
    </marker>
  </defs>
  <g stroke="#a8a294" stroke-width="1.8" marker-end="url(#ah)">
    <line x1="160" y1="152" x2="178" y2="152"/>
    <line x1="312" y1="152" x2="330" y2="152"/>
    <line x1="464" y1="152" x2="482" y2="152"/>
    <line x1="616" y1="152" x2="634" y2="152"/>
    <line x1="768" y1="152" x2="786" y2="152"/>
  </g>

  <!-- 备用通路 -->
  <rect x="272" y="268" width="250" height="76" rx="10" fill="#ffffff" stroke="#b9b2a4" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="397" y="300" text-anchor="middle" font-size="14.5" fill="#6b7280">推送失败就走这条</text>
  <text x="397" y="324" text-anchor="middle" font-size="12.5" fill="#9aa0a6">直接用 Git API 提交，更稳</text>

  <path d="M397 196 L397 264" stroke="#c0b9a9" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah2)" fill="none"/>
  <path d="M522 306 C 566 306, 566 250, 560 208" stroke="#c0b9a9" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah2)" fill="none"/>

  <text x="36" y="376" font-size="12.5" fill="#a8a294">实线＝正常路径　　虚线＝出问题时的备用路径</text>
</svg>
