<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">
  <rect x="0" y="0" width="960" height="380" rx="14" fill="#fbfaf7"/>
  <rect x="0.5" y="0.5" width="959" height="379" rx="13.5" fill="none" stroke="#e6e1d7"/>

  <text x="36" y="48" font-size="15" fill="#8a8578" letter-spacing="1">同一件事，两种排法</text>

  <!-- 叙事式 -->
  <text x="36" y="92" font-size="14" fill="#2f5d8c">叙事式：从现场切入，读者跟着你走一遍</text>
  <g stroke-width="1.5">
    <rect x="40" y="106" width="120" height="56" rx="9" fill="#e8f1fb" stroke="#b9d3ee"/>
    <rect x="192" y="106" width="120" height="56" rx="9" fill="#e8f1fb" stroke="#b9d3ee"/>
    <rect x="344" y="106" width="120" height="56" rx="9" fill="#e8f1fb" stroke="#b9d3ee"/>
    <rect x="496" y="106" width="120" height="56" rx="9" fill="#e8f1fb" stroke="#b9d3ee"/>
    <rect x="648" y="106" width="120" height="56" rx="9" fill="#e8f1fb" stroke="#b9d3ee"/>
    <rect x="800" y="106" width="120" height="56" rx="9" fill="#e9f4ec" stroke="#c3dfcb"/>
  </g>
  <g text-anchor="middle" font-size="14" fill="#2f5d8c">
    <text x="100" y="140">具体情境</text>
    <text x="252" y="140">一个困惑</text>
    <text x="404" y="140">怎么查的</text>
    <text x="556" y="140">机制是什么</text>
    <text x="708" y="140">卡住的地方</text>
  </g>
  <text x="860" y="140" text-anchor="middle" font-size="14" fill="#2f6b41">一句结论</text>

  <defs>
    <marker id="a2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b9d3ee"/>
    </marker>
    <marker id="a3" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#e2ded4"/>
    </marker>
  </defs>
  <g stroke="#b9d3ee" stroke-width="1.8" marker-end="url(#a2)">
    <line x1="162" y1="134" x2="190" y2="134"/>
    <line x1="314" y1="134" x2="342" y2="134"/>
    <line x1="466" y1="134" x2="494" y2="134"/>
    <line x1="618" y1="134" x2="646" y2="134"/>
    <line x1="770" y1="134" x2="798" y2="134"/>
  </g>

  <!-- 教程式 -->
  <text x="36" y="222" font-size="14" fill="#9a958a">教程式：四平八稳，读完也记不住是谁写的</text>
  <g stroke-width="1.5">
    <rect x="40" y="236" width="150" height="56" rx="9" fill="#f4f3f0" stroke="#e2ded4"/>
    <rect x="230" y="236" width="150" height="56" rx="9" fill="#f4f3f0" stroke="#e2ded4"/>
    <rect x="420" y="236" width="150" height="56" rx="9" fill="#f4f3f0" stroke="#e2ded4"/>
    <rect x="610" y="236" width="150" height="56" rx="9" fill="#f4f3f0" stroke="#e2ded4"/>
  </g>
  <g text-anchor="middle" font-size="14" fill="#9a958a">
    <text x="115" y="270">背景</text>
    <text x="305" y="270">原理</text>
    <text x="495" y="270">示例</text>
    <text x="685" y="270">总结</text>
  </g>
  <g stroke="#e2ded4" stroke-width="1.8" marker-end="url(#a3)">
    <line x1="192" y1="264" x2="228" y2="264"/>
    <line x1="382" y1="264" x2="418" y2="264"/>
    <line x1="572" y1="264" x2="608" y2="264"/>
  </g>

  <text x="36" y="348" font-size="12.5" fill="#a8a294">两种都能写完，差别在于读者读完记住的是方法，还是你</text>
</svg>
